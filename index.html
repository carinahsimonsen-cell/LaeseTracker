</style></head><body><header><h1>📚 LæseTracker</h1><p>Overblik over læsning – på tværs af klasser og skoleår</p></header><main><nav id="nav"><button data-tab="overview" class="active">Klasseoverblik</button><button data-tab="students">Elever</button><button data-tab="books">Bøger</button><button data-tab="periods">Perioder</button><button data-tab="classes">Klasser og skoleår</button><button data-tab="backup">Sikkerhedskopi</button><button type="button" id="directclassdisplay">📚 Vis for klassen</button></nav><section id="overview" class="tab"></section><section id="students" class="tab hidden"></section><section id="books" class="tab hidden"></section><section id="periods" class="tab hidden"></section><section id="classes" class="tab hidden"></section><section id="backup" class="tab hidden"></section><section id="preview" class="tab hidden"></section><p class="muted no-print"><small>Data gemmes lokalt i browseren. Husk sikkerhedskopier. Data gemmes i denne browsers lokale lager.</small></p></main><div id="printarea"></div><section id="classdisplay" class="hidden" aria-label="Klassevisning"></section><div id="lixmodal" class="hidden" role="dialog" aria-modal="true" aria-label="LIX fra bogfotos" style="position:fixed;inset:0;background:#0009;z-index:1000;padding:12px;overflow:auto"><div style="max-width:980px;margin:auto;background:white;border-radius:12px;overflow:hidden"><div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #ddd"><strong>📷 Beregn LIX fra bogfotos</strong><button id="closelix" type="button">Luk ×</button></div><iframe id="lixframe" title="Fotoberegner" src="lix.html" style="width:100%;height:min(82vh,1050px);border:0" loading="lazy"></iframe></div></div><script>'use strict';
const KEY='laesetracker_v2',OLD='laesetracker_v1';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||Date.now()+'_'+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10);
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('da-DK'):'—';
const day=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/86400000)+1;
const fmt=n=>new Intl.NumberFormat('da-DK',{maximumFractionDigits:1}).format(n);
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!Number.isNaN(Date.parse(s+'T12:00:00'));
const yearDates=y=>{const m=/^(\d{4})\/(\d{2})$/.exec(y||'');if(!m)return null;const n=Number(m[1]);return Number(m[2])===(n+1)%100?{from:n+'-08-01',to:(n+1)+'-07-31'}:null;};
const yearOf=d=>{const y=Number(d.slice(0,4)),m=Number(d.slice(5,7)),n=m>=8?y:y-1;return n+'/'+String((n+1)%100).padStart(2,'0');};
const newState=()=>({version:2,cohorts:[],years:[],students:[],memberships:[],books:[],periods:[],covers:[]});
function migrate(old){const s=newState(),c=uid(),y=uid(),label=yearOf(today());s.cohorts.push({id:c,name:'7.B',archived:false});s.years.push({id:y,cohortId:c,label,grade:'7',name:'7.B'});s.students=old.students.map(x=>({...x,archived:false}));s.memberships=s.students.map(x=>({id:uid(),studentId:x.id,yearId:y,from:'',to:''}));s.books=old.books.map(x=>({...x,cohortId:c}));return s;}
let migrationNotice=false,loadError=false;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(validate(d)){d.covers=Array.isArray(d.covers)?d.covers:[];return d;}loadError=true;return newState();}const rawOld=localStorage.getItem(OLD);if(rawOld){const o=JSON.parse(rawOld);if(Array.isArray(o.students)&&Array.isArray(o.books)){const d=migrate(o);localStorage.setItem(KEY,JSON.stringify(d));migrationNotice=true;return d;}}}catch(e){loadError=true;}return newState();}
function validate(d){return d&&d.version===2&&['cohorts','years','students','memberships','books','periods'].every(k=>Array.isArray(d[k]))&&d.cohorts.every(c=>typeof c.id==='string'&&typeof c.name==='string')&&d.years.every(y=>typeof y.id==='string'&&typeof y.cohortId==='string'&&typeof y.label==='string')&&d.students.every(s=>typeof s.id==='string'&&typeof s.name==='string')&&d.memberships.every(m=>typeof m.studentId==='string'&&typeof m.yearId==='string')&&d.books.every(b=>typeof b.id==='string'&&typeof b.studentId==='string'&&typeof b.title==='string'&&['reading','done','abandoned'].includes(b.status)&&validDate(b.start)&&Number.isInteger(b.pages)&&Number.isInteger(b.startPage)&&((b.status==='abandoned'&&b.pages===0)||b.pages>=b.startPage)&&b.startPage>=1&&(!b.end||validDate(b.end)))&&d.periods.every(p=>typeof p.id==='string'&&validDate(p.from)&&validDate(p.to));}
let state=load(),tab='overview',selectedCohort='',selectedYear='all',selectedStudent='',editingBook='',editingClassGroup='',editingPeriod='',showArchived=false,expandedHistory=false;
const cohort=id=>state.cohorts.find(c=>c.id===id);
const schoolYear=id=>state.years.find(y=>y.id===id);
const student=id=>state.students.find(s=>s.id===id);
const memberships=id=>state.memberships.filter(m=>m.yearId===id);
const yearsOf=c=>state.years.filter(y=>y.cohortId===c).sort((a,b)=>a.label.localeCompare(b.label));
const membersOf=y=>state.memberships.filter(m=>m.yearId===y).map(m=>student(m.studentId)).filter(Boolean);
const currentYear=c=>yearsOf(c).at(-1);
const nextClassName=(name,grade)=>{const n=Number(grade);if(!Number.isInteger(n)||n<0)return name;const match=/^(\s*)\d+(\s*\.\s*.*)$/.exec(name);return match?match[1]+(n+1)+match[2]:name;};
const selectedClassName=c=>selectedYear==='all'?(currentYear(c.id)?.name||c.name):(schoolYear(selectedYear)?.name||c.name);
const cohortStudents=c=>{const ids=new Set(state.memberships.filter(m=>schoolYear(m.yearId)?.cohortId===c).map(m=>m.studentId));return state.students.filter(s=>ids.has(s.id));};
const visibleStudents=()=>selectedYear==='all'?cohortStudents(selectedCohort):membersOf(selectedYear);
const yearRange=()=>selectedYear==='all'?null:yearDates(schoolYear(selectedYear)?.label);
const isInYear=(b,y)=>{const r=yearDates(y.label);if(!r)return false;const end=b.end||today();return b.start<=r.to&&end>=r.from;};
const bookCohort=b=>b.cohortId||schoolYear(state.memberships.find(m=>m.studentId===b.studentId)?.yearId)?.cohortId;
const booksInScope=()=>state.books.filter(b=>bookCohort(b)===selectedCohort&&(selectedYear==='all'||isInYear(b,schoolYear(selectedYear))));
const booksOf=id=>booksInScope().filter(b=>b.studentId===id);
const nameOf=id=>student(id)?.name||'(slettet elev)';
const sortedBooks=a=>[...a].sort((x,y)=>(x.end||x.start).localeCompare(y.end||y.start));
const modeOf=b=>b.readingMode||'read';
const preferredMode=st=>['read','audio','combined'].includes(st?.preferredReadingMode)?st.preferredReadingMode:'read';
const readingModeOptions=(value)=>[['read','Læse'],['audio','Lytte'],['combined','Kombineret']].map(([id,label])=>`<option value="${id}" ${value===id?'selected':''}>${label}</option>`).join('');
const audioMinutes=b=>Number(b.audioMinutes)||0;
const pages=b=>{if(modeOf(b)==='audio')return 0;if(b.status==='done')return Math.max(0,b.pages-b.startPage+1);if(b.status==='abandoned'&&Number.isInteger(b.lastReadPage)&&b.lastReadPage>=b.startPage)return Math.max(0,b.lastReadPage-b.startPage+1);return 0;};
const listenedMinutes=b=>{if(modeOf(b)==='read')return 0;if(b.status==='done')return audioMinutes(b);if(b.status==='abandoned'&&Number.isInteger(b.listenedMinutes)&&b.listenedMinutes>=0)return Math.min(b.listenedMinutes,audioMinutes(b));return 0;};
const pace=b=>['done','abandoned'].includes(b.status)&&b.end&&modeOf(b)!=='audio'&&pages(b)>0&&day(b.start,b.end)>0?pages(b)/day(b.start,b.end):null;
const audioPace=b=>['done','abandoned'].includes(b.status)&&b.end&&modeOf(b)!=='read'&&listenedMinutes(b)>0&&day(b.start,b.end)>0?listenedMinutes(b)/day(b.start,b.end):null;
const duration=n=>{n=Math.max(0,Math.round(Number(n)||0));const h=Math.floor(n/60),m=n%60;return h?(h+' t '+(m?m+' min':'')):(m+' min');};
const modeLabel=b=>({read:'Læst',audio:'Lydbog',combined:'Kombineret'})[modeOf(b)]||'Læst';
// A book completed in one school year belongs to that year; in-progress books are visible wherever their dates overlap.
// Book totals in a school-year view count only books completed in that school year, never twice.
const countedBooks=arr=>arr.filter(b=>b.status==='done'&&(selectedYear==='all'||yearOf(b.end)===schoolYear(selectedYear)?.label));

function groupedBooks(done){const map=new Map();for(const b of done){const key=bookKey(b.title);if(!key)continue;const x=map.get(key)||{title:b.title,author:b.author||'',count:0,stars:0,names:new Set(),classGroups:new Map()};x.count++;if(b.author&&!x.author)x.author=b.author;if(b.classBookGroup&&!x.classGroups.has(b.classBookGroup))x.classGroups.set(b.classBookGroup,{recommended:Number(b.classRecommendations)||0,participants:Number(b.classParticipants)||0});if(b.recommended){x.stars++;const st=student(b.studentId);if(st)x.names.add(st.name);}map.set(key,x);}return [...map.values()].map(x=>({...x,names:[...x.names].sort((a,b)=>a.localeCompare(b,'da')),classRecommendations:[...x.classGroups.values()].reduce((a,v)=>a+v.recommended,0),classParticipants:[...x.classGroups.values()].reduce((a,v)=>a+v.participants,0)})).sort((a,b)=>a.title.localeCompare(b.title,'da'));}

// Beregning fra indsatsens start; alene registrerede læste sider (ikke lydbogsminutter).
const READING_SPEED_BY_GRADE={6:180,7:200,8:225,9:250};
function classReadingProgress(){
 const c=cohort(selectedCohort);if(!c)return {actualMinutes:null,targetMinutes:null};
 const cohortYears=yearsOf(selectedCohort);
 const start=c.readingStartDate||((cohortYears.some(y=>y.label==='2026/27'&&Number(y.grade)===7))?'2026-09-17':null);
 if(!start)return {actualMinutes:null,targetMinutes:null};
 const end=today(),range=selectedYear==='all'?null:yearRange();
 const from=range&&range.from>start?range.from:start;
 const to=range&&range.to<end?range.to:end;
 if(to<from)return {actualMinutes:null,targetMinutes:null};
 const days=Math.round((Date.parse(to+'T12:00:00')-Date.parse(from+'T12:00:00'))/86400000)+1;
 const pupils=selectedYear==='all'?cohortStudents(selectedCohort):membersOf(selectedYear);
 if(!pupils.length||days<1)return {actualMinutes:null,targetMinutes:null};
 // Målet stiger ved starten af hver ny 7-dages periode fra indsatsens start.
 const weeks=Math.ceil(days/7);
 const actualMinutes=booksInScope().filter(b=>['done','abandoned'].includes(b.status)&&modeOf(b)!=='audio'&&b.end&&b.end>=from&&b.end<=to).reduce((total,b)=>{
   const grade=Number(cohortYears.find(y=>y.label===yearOf(b.end))?.grade);
   const speed=READING_SPEED_BY_GRADE[grade];
   return total+(speed?pages(b)*360/speed:0);
 },0);
 return {actualMinutes:Math.round(actualMinutes),targetMinutes:pupils.length*100*weeks};
}
function publicShelfPayload(){
 const done=displayBooks(),grouped=groupedBooks(done);
 const pupils=selectedYear==='all'?cohortStudents(selectedCohort):membersOf(selectedYear);
 const perPupil=new Map(pupils.map(st=>[st.id,0]));
 for(const book of done){if(perPupil.has(book.studentId))perPupil.set(book.studentId,perPupil.get(book.studentId)+1);}
 const counts=new Map();for(const n of perPupil.values())counts.set(n,(counts.get(n)||0)+1);
 const distribution=[...counts].sort((a,b)=>b[0]-a[0]).map(([books,students])=>({books,students}));
 return {pages:summary(booksInScope()).pages,readingProgress:classReadingProgress(),distribution,books:grouped.map(b=>({title:b.title,author:b.author,count:b.count,stars:b.stars,names:b.names,cover:coverSafe(coverFor(b.title)),descriptionUrl:/^https:\/\/[^\s]+$/i.test(bookInfoFor(b.title).descriptionUrl||'')?bookInfoFor(b.title).descriptionUrl:'',isSeries:!!bookInfoFor(b.title).isSeries,classRecommendations:b.classRecommendations,classParticipants:b.classParticipants}))};
}

 return PUBLIC_SHELF_TEMPLATE.replace('__EXPORTED_DATA__',json);

function readingProfileAudio(st,arr,mixed=false){
 const sum=summary(arr),activity=sortedBooks(arr.filter(b=>['done','abandoned'].includes(b.status)));
 const listened=activity.filter(b=>audioPace(b)!==null),read=activity.filter(b=>pace(b)!==null);
 const totalAudio=arr.filter(b=>b.status==='done').reduce((n,b)=>n+(modeOf(b)!=='read'?listenedMinutes(b):0),0);
 const totalPages=sum.pages;
 const dailyMinutes=listenED=>listenED.length?listenED.reduce((n,b)=>n+listenedMinutes(b),0)/Math.max(1,listenED.reduce((n,b)=>n+(b.start&&b.end?day(b.start,b.end):0),0)):null;
 const daily=dailyMinutes(listened);

const GITHUB_PUBLISH_KEY='laesetracker_github_publish_v1';
let publishCohortId='';
function renderPublishCohorts(){
 const field=$('publishcohort');if(!field)return;
 if(!cohort(publishCohortId))publishCohortId=cohort(selectedCohort)?.id||state.cohorts[0]?.id||'';
 field.innerHTML=state.cohorts.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.archived?' (arkiveret)':''}</option>`).join('');
 field.value=publishCohortId;
}
function shelfFileName(c){
 const p=githubPublishSettings();
 const clean=name=>String(name||'').toLocaleLowerCase('da').replace(/[^a-z0-9æøå]+/g,'');
 const old=p.path||'Bogreol - 7.b.html';
 // Den eksisterende offentlige bogreol skal beholde sit oprindelige link.
 const legacy=state.cohorts.filter(x=>yearsOf(x.id).some(y=>clean(y.name)===clean(old.replace(/^Bogreol\s*-\s*/i,'').replace(/\.html$/i,''))));
 if(legacy.length===1&&legacy[0].id===c.id)return old;
 // Unikt filnavn baseret på klassens stabile ID, så navneskift og parallelklasser ikke overskriver hinanden.
 const id=String(c.id).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,32);
 return 'Bogreol - '+String(yearsOf(c.id)[0]?.name||c.name).toLocaleLowerCase('da').replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+id+'.html';
}
// Kortlinks er knyttet til klassens stabile ID, ikke klassetrin eller skoleår.
const PUBLIC_SHORTLINKS_KEY='laesetracker_public_shortlinks_v1';
function publicShortlinks(){try{return JSON.parse(localStorage.getItem(PUBLIC_SHORTLINKS_KEY)||'{}')||{};}catch(e){return {};}}
function publicShelfLongUrl(c){
 const p=githubPublishSettings();
 if(!p.owner||!p.repo)return '';
 return 'https://'+p.owner+'.github.io/'+encodeURIComponent(p.repo)+'/'+shelfFileName(c).split('/').map(encodeURIComponent).join('/');
}
function selectedPublishCohort(){return cohort($('publishcohort')?.value);}
function publicShelfChosenUrl(c){return publicShortlinks()[c.id]||publicShelfLongUrl(c);}
function renderPublicShelfLinks(){
 const c=selectedPublishCohort(),a=$('publicshelfurl'),field=$('publicshortlink');if(!a||!field)return;
 if(!c){a.textContent='Vælg en klasse';a.removeAttribute('href');field.value='';return;}
 const short=publicShortlinks()[c.id]||'',long=publicShelfLongUrl(c);
 a.textContent=short||long||'Gem GitHub-opsætningen først';
 if(short||long)a.href=short||long;else a.removeAttribute('href');
 field.value=short;
}
function savePublicShortlink(){
 const c=selectedPublishCohort();if(!c)return alert('Vælg en klasse først.');
 const raw=$('publicshortlink')?.value.trim()||'';
 let url;try{url=new URL(raw);}catch(e){return alert('Indsæt et gyldigt kortlink fra kortlink.dk.');}
 if(url.protocol!=='https:'||!(url.hostname==='kortlink.dk'||url.hostname==='www.kortlink.dk')||!url.pathname||url.pathname==='/')return alert('Indsæt et gyldigt https-link fra kortlink.dk.');
 const links=publicShortlinks();links[c.id]=url.href;
 try{localStorage.setItem(PUBLIC_SHORTLINKS_KEY,JSON.stringify(links));renderPublicShelfLinks();alert('Kortlinket er gemt til '+c.name+'.');}catch(e){alert('Kunne ikke gemme kortlinket: '+e.message);}
}
function clearPublicShortlink(){const c=selectedPublishCohort();if(!c)return;if(!publicShortlinks()[c.id])return;if(!confirm('Fjern det gemte kortlink til '+c.name+'?'))return;const links=publicShortlinks();delete links[c.id];localStorage.setItem(PUBLIC_SHORTLINKS_KEY,JSON.stringify(links));renderPublicShelfLinks();}
function openPublicShelf(){const c=selectedPublishCohort();if(!c)return;const url=publicShelfChosenUrl(c);if(!url)return alert('Gem GitHub-opsætningen først.');window.open(url,'_blank','noopener,noreferrer');}
async function copyPublicShelf(){const c=selectedPublishCohort();if(!c)return;const url=publicShelfChosenUrl(c);if(!url)return alert('Gem GitHub-opsætningen først.');try{await navigator.clipboard.writeText(url);alert('Linket til '+c.name+' er kopieret.');}catch(e){prompt('Kopiér linket her:',url);}}
function makePublicShortlink(){const c=selectedPublishCohort();if(!c)return;const url=publicShelfLongUrl(c);if(!url)return alert('Gem GitHub-opsætningen først.');navigator.clipboard?.writeText(url).catch(()=>{});window.open('https://kortlink.dk/','_blank','noopener,noreferrer');alert('Bogreolens lange link er forsøgt kopieret. Indsæt det på kortlink.dk, opret kortlinket, og indsæt det bagefter i feltet her i LæseTracker.');}
document.addEventListener('change',e=>{if(e.target.id==='publishcohort'){publishCohortId=e.target.value;renderPublicShelfLinks();}});
function shelfHtmlForCohort(id){
 const beforeCohort=selectedCohort,beforeYear=selectedYear;
 try{selectedCohort=id;selectedYear='all';return publicShelfHtml();}
 finally{selectedCohort=beforeCohort;selectedYear=beforeYear;}
}
function githubPublishSettings(){
 try{return JSON.parse(localStorage.getItem(GITHUB_PUBLISH_KEY)||'{}')||{};}catch(e){return {};}
}
function githubPublishForm(){
 const p=githubPublishSettings();
 for(const [id,value] of Object.entries({githubowner:p.owner||'carinahsimonsen-cell',githubrepo:p.repo||'LaeseTracker',githubtoken:p.token||''})){
  const field=$(id);if(field)field.value=value;
 }
}
function saveGithubPublish(){
 const owner=$('githubowner')?.value.trim(),repo=$('githubrepo')?.value.trim(),path=githubPublishSettings().path||'Bogreol - 7.b.html',token=$('githubtoken')?.value.trim();
 if(!/^[a-z\d-]+$/i.test(owner)||!/^[\w.-]+$/.test(repo)||!path||path.startsWith('/')||path.includes('..')||!token||!/^github_pat_/.test(token))return alert('Udfyld GitHub-brugernavn, repository og en fine-grained adgangsnøgle.');
 if(!confirm('Gem adgangsnøglen lokalt i denne browser? Brug kun på din personlige computer.'))return;
 try{localStorage.setItem(GITHUB_PUBLISH_KEY,JSON.stringify({owner,repo,path,token}));renderPublicShelfLinks();alert('GitHub-forbindelsen er gemt. Nu kan du opdatere bogreolen med ét klik.');}catch(e){alert('Kunne ikke gemme opsætningen: '+e.message);}
}
function clearGithubPublish(){
 if(!confirm('Fjern GitHub-adgangsnøglen fra denne browser?'))return;
 localStorage.removeItem(GITHUB_PUBLISH_KEY);githubPublishForm();alert('Adgangsnøglen er fjernet fra denne browser.');
}
function githubBase64(text){
 const bytes=new TextEncoder().encode(text);let binary='';
 for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(binary);
}
async function publishPublicShelf(){
 const c=cohort($('publishcohort')?.value);if(!c)return alert('Vælg en klasse først.');
 const p=githubPublishSettings();
 if(!p.token||!p.owner||!p.repo||!p.path){switchTab('backup');$('backup').querySelector('details')?.setAttribute('open','');return alert('Åbn GitHub-opsætning, og gem din adgangsnøgle første gang.');}
 const path=shelfFileName(c);
 if(!confirm('Opdater den offentlige bogreol for '+c.name+' (alle skoleår)?\n\nFil: '+path))return;
 const btn=$('publishpublicshelf'),status=$('githubpublishstatus');
 if(btn){btn.disabled=true;btn.textContent='⏳ Opdaterer bogreolen…';}
 if(status)status.textContent='';
 try{
  const url='https://api.github.com/repos/'+encodeURIComponent(p.owner)+'/'+encodeURIComponent(p.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+p.token,'X-GitHub-Api-Version':'2022-11-28'};
  const current=await fetch(url,{headers,cache:'no-store'});
  let sha;
  if(current.ok){const existing=await current.json();sha=existing.sha;}
  else if(current.status!==404){const detail=await current.json().catch(()=>({}));throw Error('GitHub kunne ikke læse filen ('+current.status+'). '+(detail.message||''));}
  const body={message:'Opdater offentlig bogreol fra LæseTracker',content:githubBase64(shelfHtmlForCohort(c.id))};
  if(sha)body.sha=sha;
  const response=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!response.ok){const detail=await response.json().catch(()=>({}));throw Error('GitHub afviste opdateringen ('+response.status+'). '+(detail.message||''));}
  if(status)status.textContent='✓ '+c.name+' er sendt til GitHub';
  alert('Bogreolen er opdateret på GitHub! Elevernes link er det samme. Det kan tage lidt tid, før GitHub Pages viser ændringen.');
 }catch(e){if(status)status.textContent='Opdatering mislykkedes';alert('Bogreolen blev ikke opdateret.\n\n'+e.message+'\n\nDine registreringer er uændrede.');}
 finally{if(btn){btn.disabled=false;btn.textContent='🔄 Opdater valgt bogreol';}}
}

async function importData(){const file=$('importfile')?.files[0];if(!file)return alert('Vælg en fil først.');let d;try{d=JSON.parse(await file.text());}catch(e){return alert('Filen er ikke gyldig JSON.');}let incoming;if(d?.format==='laesetracker'&&d.version===1&&Array.isArray(d.students)&&Array.isArray(d.books)){incoming=migrate(d);}else if(d?.format==='laesetracker'&&d.version===2&&validate(d))incoming={version:2,cohorts:d.cohorts,years:d.years,students:d.students,memberships:d.memberships,books:d.books,periods:d.periods,covers:Array.isArray(d.covers)?d.covers:[]};else return alert('Filen har ikke det forventede format.');if(!confirm('Erstat ALLE nuværende registreringer med sikkerhedskopien? Eksportér først de nuværende data.'))return;const previous=state;state=incoming;if(!save()){state=previous;return;}selectedCohort='';selectedYear='all';selectedStudent='';editingBook='';editingPeriod='';render();alert('Sikkerhedskopien er indlæst.');}
function printStudent(){const s=student(selectedStudent);if(!s)return;const arr=booksOf(s.id),sum=summary(arr),periods=periodsOf(s.id);$('printarea').innerHTML=`<h1>Læserapport: ${esc(s.name)}</h1><p>${esc(cohort(selectedCohort)?selectedClassName(cohort(selectedCohort)):'')} · ${selectedYear==='all'?'Alle skoleår':esc(schoolYear(selectedYear)?.label||'')} · Udskrevet ${date(today())}</p>${readingProfile(s,arr)}<h2>Boghistorik</h2><table><thead><tr><th>Titel</th><th>Læseform</th><th>Start</th><th>Slut</th><th>Status</th><th>Sider</th><th>Lyttet</th><th>LIX</th><th>Sider/dag</th><th>Min./dag</th></tr></thead><tbody>${sortedBooks(arr).map(b=>`<tr><td>${esc(b.title)}</td><td>${modeLabel(b)}</td><td>${date(b.start)}</td><td>${date(b.end)}</td><td>${b.status==='done'?'Afsluttet':b.status==='reading'?'I gang':'Opgivet'}</td><td>${b.status==='done'&&modeOf(b)!=='audio'?pages(b):'—'}</td><td>${b.status==='done'&&modeOf(b)!=='read'?duration(audioMinutes(b)):'—'}</td><td>${b.lix??'—'}</td><td>${pace(b)===null?'—':fmt(pace(b))}</td><td>${audioPace(b)===null?'—':fmt(audioPace(b))}</td></tr>`).join('')}</tbody></table><p><small>Afsluttede bøger tælles i det skoleår, hvor de afsluttes. Sider og lytteminutter pr. kalenderdag er aktivitetsmål, ikke et mål for faktisk læse- eller lyttehastighed.</small></p>${periods.length?'<h2>Registrerede perioder</h2><p><small>Perioder vises uden årsag eller bemærkninger af hensyn til privatlivet.</small></p><table><thead><tr><th>Fra</th><th>Til</th></tr></thead><tbody>'+periods.map(p=>`<tr><td>${date(p.from)}</td><td>${date(p.to)}</td></tr>`).join('')+'</tbody></table>':''}`;window.print();}
window.addEventListener('message',event=>{if(event.origin!==window.location.origin||event.source!==document.getElementById('lixframe').contentWindow)return;const msg=event.data;if(!msg||msg.type!=='laesetracker-lix'||typeof msg.lix!=='number'||!Number.isFinite(msg.lix)||msg.lix<0||msg.lix>200)return;const field=document.querySelector('#bookform input[name="lix"]');if(field){field.value=msg.lix.toFixed(1);document.getElementById('lixmodal').classList.add('hidden');field.focus();}else alert('Åbn først Registrer bog.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('classdisplay').classList.contains('hidden'))closeClassDisplay();});
render();
if(loadError)alert('Der opstod en fejl ved læsning af gemte data. Eksisterende data er ikke blevet overskrevet. Brug en sikkerhedskopi, eller undersøg browserlageret før du gemmer nye registreringer.');
else if(migrationNotice)alert('Version 1 er overført til version 2. De oprindelige data i version 1 er bevaret. Kontrollér skoleår og klassebetegnelse under Klasser og skoleår, og hent en sikkerhedskopi.');

// Reflow shelves only after the container has a measurable width.
function arrangeBookShelves(root){
 if(!root || !root.isConnected || root.getBoundingClientRect().width < 240)return;
 const books=[...root.querySelectorAll('.bookspine')];if(!books.length)return;
 const sample=root.querySelector('.shelf-row');if(!sample)return;
 const rs=getComputedStyle(root),ss=getComputedStyle(sample);
 const available=root.clientWidth-(parseFloat(rs.paddingLeft)||0)-(parseFloat(rs.paddingRight)||0)-(parseFloat(ss.paddingLeft)||0)-(parseFloat(ss.paddingRight)||0)-8;
 const gap=parseFloat(ss.columnGap)||7;
 const rows=[];let row=[],used=0;
 for(const book of books){const w=parseFloat(book.style.getPropertyValue('--w'))||60;
  if(row.length && used+gap+w>available){rows.push(row);row=[];used=0;}
  used+=(row.length?gap:0)+w;row.push(book);
 }
 if(row.length)rows.push(row);
 const fragment=document.createDocumentFragment();
 for(const group of rows){const r=document.createElement('div');r.className='shelf-row';group.forEach(b=>r.appendChild(b));fragment.appendChild(r);}
 root.replaceChildren(fragment);
}
let watchedShelf=null,lastShelfWidth=0;
const shelfResizeObserver=new ResizeObserver(entries=>{
 for(const entry of entries){const width=entry.target.getBoundingClientRect().width;
  if(width>=240 && Math.abs(width-lastShelfWidth)>1){lastShelfWidth=width;arrangeBookShelves(entry.target);}
 }
});
function watchBookShelf(){const root=document.querySelector('.bookshelf');if(!root || root===watchedShelf)return;
 if(watchedShelf)shelfResizeObserver.unobserve(watchedShelf);
 watchedShelf=root;lastShelfWidth=0;shelfResizeObserver.observe(root);
 if(root.getBoundingClientRect().width>=240)arrangeBookShelves(root);
}
new MutationObserver(watchBookShelf).observe(document.body,{childList:true,subtree:true});
watchBookShelf();
