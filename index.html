</style></head><body><header><h1>📚 LæseTracker</h1><p>Overblik over læsning – på tværs af klasser og skoleår</p></header><main><nav id="nav"><button data-tab="overview" class="active">Klasseoverblik</button><button data-tab="students">Elever</button><button data-tab="books">Bøger</button><button data-tab="periods">Perioder</button><button data-tab="classes">Klasser og skoleår</button><button data-tab="backup">Sikkerhedskopi</button><button data-tab="preview">📚 Bogreol og elevvisning</button></nav><section id="overview" class="tab"></section><section id="students" class="tab hidden"></section><section id="books" class="tab hidden"></section><section id="periods" class="tab hidden"></section><section id="classes" class="tab hidden"></section><section id="backup" class="tab hidden"></section><section id="preview" class="tab hidden"></section><p class="muted no-print"><small>Data gemmes lokalt i browseren. Husk sikkerhedskopier. Data gemmes i denne browsers lokale lager.</small></p></main><div id="printarea"></div><section id="classdisplay" class="hidden" aria-label="Klassevisning"></section><div id="lixmodal" class="hidden" role="dialog" aria-modal="true" aria-label="LIX fra bogfotos" style="position:fixed;inset:0;background:#0009;z-index:1000;padding:12px;overflow:auto"><div style="max-width:980px;margin:auto;background:white;border-radius:12px;overflow:hidden"><div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #ddd"><strong>📷 Beregn LIX fra bogfotos</strong><button id="closelix" type="button">Luk ×</button></div><iframe id="lixframe" title="Fotoberegner" src="lix.html" style="width:100%;height:min(82vh,1050px);border:0" loading="lazy"></iframe></div></div><script>'use strict';
const KEY='laesetracker_v2',OLD='laesetracker_v1';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||Date.now()+'_'+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10);
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('da-DK'):'—';
const day=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/86400000)+1;
const fmt=n=>new Intl.NumberFormat('da-DK',{maximumFractionDigits:1}).format(n);
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!Number.isNaN(Date.parse(s+'T12:00:00'));
const yearDates=y=>{const m=/^(\d{4})\/(\d{2})$/.exec(y||'');if(!m)return null;const n=Number(m[1]);return Number(m[2])===(n+1)%100?{from:n+'-08-01',to:(n+1)+'-07-31'}:null;};
const yearOf=d=>{const y=Number(d.slice(0,4)),m=Number(d.slice(5,7)),n=m>=8?y:y-1;return n+'/'+String((n+1)%100).padStart(2,'0');};
const newState=()=>({version:2,cohorts:[],years:[],students:[],memberships:[],books:[],periods:[],covers:[]});
function migrate(old){const s=newState(),c=uid(),y=uid(),label=yearOf(today());s.cohorts.push({id:c,name:'7.B',archived:false});s.years.push({id:y,cohortId:c,label,grade:'7',name:'7.B'});s.students=old.students.map(x=>({...x,archived:false}));s.memberships=s.students.map(x=>({id:uid(),studentId:x.id,yearId:y,from:'',to:''}));s.books=old.books.map(x=>({...x,cohortId:c}));return s;}
let migrationNotice=false,loadError=false;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(validate(d)){d.covers=Array.isArray(d.covers)?d.covers:[];return d;}loadError=true;return newState();}const rawOld=localStorage.getItem(OLD);if(rawOld){const o=JSON.parse(rawOld);if(Array.isArray(o.students)&&Array.isArray(o.books)){const d=migrate(o);localStorage.setItem(KEY,JSON.stringify(d));migrationNotice=true;return d;}}}catch(e){loadError=true;}return newState();}
function validate(d){return d&&d.version===2&&['cohorts','years','students','memberships','books','periods'].every(k=>Array.isArray(d[k]))&&d.cohorts.every(c=>typeof c.id==='string'&&typeof c.name==='string')&&d.years.every(y=>typeof y.id==='string'&&typeof y.cohortId==='string'&&typeof y.label==='string')&&d.students.every(s=>typeof s.id==='string'&&typeof s.name==='string')&&d.memberships.every(m=>typeof m.studentId==='string'&&typeof m.yearId==='string')&&d.books.every(b=>typeof b.id==='string'&&typeof b.studentId==='string'&&typeof b.title==='string'&&['reading','done','abandoned'].includes(b.status)&&validDate(b.start)&&Number.isInteger(b.pages)&&Number.isInteger(b.startPage)&&((b.status==='abandoned'&&b.pages===0)||b.pages>=b.startPage)&&b.startPage>=1&&(!b.end||validDate(b.end)))&&d.periods.every(p=>typeof p.id==='string'&&validDate(p.from)&&validDate(p.to));}
let state=load(),tab='overview',selectedCohort='',selectedYear='all',selectedStudent='',editingBook='',editingPeriod='',showArchived=false,expandedHistory=false;
const cohort=id=>state.cohorts.find(c=>c.id===id);
const schoolYear=id=>state.years.find(y=>y.id===id);
const student=id=>state.students.find(s=>s.id===id);
const memberships=id=>state.memberships.filter(m=>m.yearId===id);
const yearsOf=c=>state.years.filter(y=>y.cohortId===c).sort((a,b)=>a.label.localeCompare(b.label));
const membersOf=y=>state.memberships.filter(m=>m.yearId===y).map(m=>student(m.studentId)).filter(Boolean);
const currentYear=c=>yearsOf(c).at(-1);
const nextClassName=(name,grade)=>{const n=Number(grade);if(!Number.isInteger(n)||n<0)return name;const match=/^(\s*)\d+(\s*\.\s*.*)$/.exec(name);return match?match[1]+(n+1)+match[2]:name;};
const selectedClassName=c=>selectedYear==='all'?(currentYear(c.id)?.name||c.name):(schoolYear(selectedYear)?.name||c.name);
const cohortStudents=c=>{const ids=new Set(state.memberships.filter(m=>schoolYear(m.yearId)?.cohortId===c).map(m=>m.studentId));return state.students.filter(s=>ids.has(s.id));};
const visibleStudents=()=>selectedYear==='all'?cohortStudents(selectedCohort):membersOf(selectedYear);
const yearRange=()=>selectedYear==='all'?null:yearDates(schoolYear(selectedYear)?.label);
const isInYear=(b,y)=>{const r=yearDates(y.label);if(!r)return false;const end=b.end||today();return b.start<=r.to&&end>=r.from;};
const bookCohort=b=>b.cohortId||schoolYear(state.memberships.find(m=>m.studentId===b.studentId)?.yearId)?.cohortId;
const booksInScope=()=>state.books.filter(b=>bookCohort(b)===selectedCohort&&(selectedYear==='all'||isInYear(b,schoolYear(selectedYear))));
const booksOf=id=>booksInScope().filter(b=>b.studentId===id);
const nameOf=id=>student(id)?.name||'(slettet elev)';
const sortedBooks=a=>[...a].sort((x,y)=>(x.end||x.start).localeCompare(y.end||y.start));
const modeOf=b=>b.readingMode||'read';
const audioMinutes=b=>Number(b.audioMinutes)||0;
const pages=b=>{if(modeOf(b)==='audio')return 0;if(b.status==='done')return Math.max(0,b.pages-b.startPage+1);if(b.status==='abandoned'&&Number.isInteger(b.lastReadPage)&&b.lastReadPage>=b.startPage)return Math.max(0,b.lastReadPage-b.startPage+1);return 0;};
const listenedMinutes=b=>{if(modeOf(b)==='read')return 0;if(b.status==='done')return audioMinutes(b);if(b.status==='abandoned'&&Number.isInteger(b.listenedMinutes)&&b.listenedMinutes>=0)return Math.min(b.listenedMinutes,audioMinutes(b));return 0;};
const pace=b=>['done','abandoned'].includes(b.status)&&b.end&&modeOf(b)!=='audio'&&pages(b)>0&&day(b.start,b.end)>0?pages(b)/day(b.start,b.end):null;
const audioPace=b=>['done','abandoned'].includes(b.status)&&b.end&&modeOf(b)!=='read'&&listenedMinutes(b)>0&&day(b.start,b.end)>0?listenedMinutes(b)/day(b.start,b.end):null;
const duration=n=>{n=Math.max(0,Math.round(Number(n)||0));const h=Math.floor(n/60),m=n%60;return h?(h+' t '+(m?m+' min':'')):(m+' min');};
const modeLabel=b=>({read:'Læst',audio:'Lydbog',combined:'Kombineret'})[modeOf(b)]||'Læst';
// A book completed in one school year belongs to that year; in-progress books are visible wherever their dates overlap.
// Book totals in a school-year view count only books completed in that school year, never twice.
const countedBooks=arr=>arr.filter(b=>b.status==='done'&&(selectedYear==='all'||yearOf(b.end)===schoolYear(selectedYear)?.label));
const summary=arr=>{const done=countedBooks(arr),activity=arr.filter(b=>['done','abandoned'].includes(b.status)&&(selectedYear==='all'||(b.end&&yearOf(b.end)===schoolYear(selectedYear)?.label))),p=activity.reduce((n,b)=>n+pages(b),0),mins=activity.reduce((n,b)=>n+listenedMinutes(b),0),pd=activity.filter(b=>modeOf(b)!=='audio'&&pages(b)>0).reduce((n,b)=>n+day(b.start,b.end),0),ad=activity.filter(b=>modeOf(b)!=='read'&&listenedMinutes(b)>0).reduce((n,b)=>n+day(b.start,b.end),0);return {count:done.length,pages:p,minutes:mins,pace:pd?p/pd:null,audioPace:ad?mins/ad:null};};
const cards=s=>`<div class="grid"><div class="stat">Afsluttede bøger<strong>${s.count}</strong></div><div class="stat">Læst<strong>${fmt(s.pages)} sider</strong></div><div class="stat">Lyttet<strong>${duration(s.minutes)}</strong></div><div class="stat">Sider pr. kalenderdag<strong>${s.pace===null?'—':fmt(s.pace)}</strong></div><div class="stat">Minutter pr. kalenderdag<strong>${s.audioPace===null?'—':fmt(s.audioPace)}</strong></div></div>`;
const periodLabel=k=>({holiday:'Ferie',illness:'Sygdom',absence:'Andet fravær',pause:'Pause i læseindsatsen',other:'Andet'})[k]||'Andet';
function save(){if(loadError){alert('Eksisterende data kan ikke læses. Eksportér eller undersøg browserlageret, før du gemmer.');return false;}try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){alert('Kunne ikke gemme. Eksportér en sikkerhedskopi og kontrollér browserens lager.');return false;}}
function change(fn){const before=JSON.stringify(state);fn();if(!save()){state=JSON.parse(before);return false;}render();return true;}
function options(arr,value,fn){return arr.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(fn(x))}</option>`).join('');}
function selectContext(){if(!cohort(selectedCohort))selectedCohort=state.cohorts.find(c=>!c.archived)?.id||state.cohorts[0]?.id||'';if(selectedYear!=='all'&&schoolYear(selectedYear)?.cohortId!==selectedCohort)selectedYear='all';const visible=visibleStudents();if(!visible.some(s=>s.id===selectedStudent))selectedStudent=visible[0]?.id||'';}
function context(){const c=cohort(selectedCohort);if(!c)return '<div class="panel"><h2>Velkommen til LæseTracker</h2><p>Opret din første klasse under fanen <strong>Klasser og skoleår</strong>.</p></div>';return `<div class="panel context"><div class="fields"><label>Vælg klasse<select id="cohortselect">${options(state.cohorts,selectedCohort,c=>(currentYear(c.id)?.name||c.name)+(c.archived?' (arkiveret)':''))}</select></label><label>Vælg skoleår<select id="yearselect"><option value="all" ${selectedYear==='all'?'selected':''}>Alle skoleår</option>${options(yearsOf(selectedCohort),selectedYear,y=>y.label+' · '+y.name)}</select></label></div><small>Skift mellem skoleår uden at miste tidligere registreringer.</small></div>`;}

function displayBooks(){return booksInScope().filter(b=>b.status==='done'&&(selectedYear==='all'||yearOf(b.end)===schoolYear(selectedYear)?.label));}
function displayTopData(){
 const ss=visibleStudents().filter(x=>!x.archived),result=[];
 const stats=ss.map(st=>{const arr=booksOf(st.id),done=countedBooks(arr),p=arr.filter(b=>['done','abandoned'].includes(b.status)).reduce((n,b)=>n+pages(b),0);return {st,books:done.length,pages:p};});
 const byBooks=[...stats].filter(x=>x.books>0).sort((a,b)=>b.books-a.books||a.st.name.localeCompare(b.st.name,'da'))[0];
 const byPages=[...stats].filter(x=>x.pages>0).sort((a,b)=>b.pages-a.pages||a.st.name.localeCompare(b.st.name,'da'))[0];
 const improvements=ss.map(st=>{const arr=sortedBooks(booksOf(st.id).filter(b=>pace(b)!==null));if(arr.length<2)return null;const prev=pace(arr.at(-2)),last=pace(arr.at(-1));return prev>0&&last>prev?{st,gain:(last-prev)/prev}:null;}).filter(Boolean).sort((a,b)=>b.gain-a.gain);
 if(byBooks)result.push({label:'Flest bøger',name:byBooks.st.name,value:byBooks.books+' '+(byBooks.books===1?'bog':'bøger')});
 if(byPages)result.push({label:'Flest sider',name:byPages.st.name,value:fmt(byPages.pages)+' sider'});
 if(improvements[0])result.push({label:'Største fremgang',name:improvements[0].st.name,value:'Bedre tempo end sidst'});
 return result.slice(0,3);
}
function bookKey(title){return String(title||'').trim().toLocaleLowerCase('da');}
function coverFor(title){return (state.covers||[]).find(x=>x.key===bookKey(title))?.image||'';}
function coverSafe(url){const u=String(url||'');return /^https:\/\//i.test(u)||/^data:image\/(?:png|jpeg|webp);base64,/i.test(u)?u:'';}
function groupedBooks(done){const map=new Map();for(const b of done){const key=bookKey(b.title);if(!key)continue;const x=map.get(key)||{title:b.title,author:b.author||'',count:0,stars:0,names:new Set()};x.count++;if(b.author&&!x.author)x.author=b.author;if(b.recommended){x.stars++;const st=student(b.studentId);if(st)x.names.add(st.name);}map.set(key,x);}return [...map.values()].map(x=>({...x,names:[...x.names].sort((a,b)=>a.localeCompare(b,'da'))})).sort((a,b)=>a.title.localeCompare(b.title,'da'));}
function starHtml(n){return n?`<span class="spine-stars" title="${n} anbefalinger" style="--star-size:${n>30?7:n>16?8:n>8?9:11}px">${Array.from({length:n},()=>'<span>⭐</span>').join('')}</span>`:'';}
function bookDetail(title){const x=groupedBooks(displayBooks()).find(b=>bookKey(b.title)===bookKey(title));if(!x)return '';const cover=coverSafe(coverFor(x.title));return `<div class="book-detail-inner"><div class="book-detail-cover">${cover?`<img src="${esc(cover)}" alt="Forside til ${esc(x.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="cover-placeholder" style="${cover?'display:none':''}">📖<br>${esc(x.title)}</div></div><div><h2>${esc(x.title)}</h2>${x.author?`<p>Af ${esc(x.author)}</p>`:''}<p><strong>${x.count}</strong> ${x.count===1?'elev har':'elever har'} afsluttet bogen</p><div class="detail-stars">${starHtml(x.stars)||'Ingen anbefalinger endnu'}</div><h3>Anbefalet af</h3><p>${x.names.length?esc(x.names.join(', ')):'Ingen har anbefalet bogen endnu.'}</p><button type="button" id="closebookdetail">Luk</button></div></div>`;}
function showBookDetail(title,source){const target=source?.closest?.('.panel, #classdisplay')?.querySelector?.('#bookdetail')||document.querySelector('#classdisplay:not(.hidden) #bookdetail')||document.querySelector('#preview #bookdetail');if(!target)return;target.innerHTML=bookDetail(title);target.classList.remove('hidden');target.scrollIntoView({behavior:'smooth',block:'nearest'});}
function shelfHtml(done){
 const items=groupedBooks(done);if(!items.length)return '<div class="cd-empty">Bogreolen venter på klassens første afsluttede bog 📚</div>';
 const colors=['#a94f52','#3f7180','#8a633e','#62649a','#47745d','#9a6a76','#6f7d42','#49627f','#8a5541','#5d6e72'],rows=[];for(let i=0;i<items.length;i+=14)rows.push(items.slice(i,i+14));
 return rows.map((row,ri)=>`<div class="shelf-row">${row.map((x,i)=>{const n=ri*14+i,h=145+(n*23%45),w=Math.min(96,Math.max(54,52+(n*17%23)+Math.floor(x.stars/6)*5)),rot=[-1.2,.4,0,1,-.5][n%5],c=colors[n%colors.length];return `<button type="button" class="bookspine" data-shelf-book="${esc(x.title)}" title="${esc(x.title)} · ${x.stars} anbefalinger" style="--h:${h}px;--w:${w}px;--r:${rot}deg;--c:${c}"><span>${esc(x.title)}</span>${x.count>1?`<b>×${x.count}</b>`:''}${starHtml(x.stars)}</button>`;}).join('')}</div>`).join('');
}

function classMilestone(bookCount,pageCount){const nextPages=Math.ceil((pageCount+1)/1000)*1000,nextBooks=Math.ceil((bookCount+1)/10)*10;if(pageCount>=1000&&pageCount%1000<120)return `🎉 Klassen har passeret <strong>${fmt(Math.floor(pageCount/1000)*1000)} sider</strong>!`;if(bookCount>=10&&bookCount%10<2)return `🎉 Klassen har rundet <strong>${Math.floor(bookCount/10)*10} afsluttede bøger</strong>!`;return `Næste fælles milepæl: <strong>${fmt(nextPages)} sider</strong> eller <strong>${nextBooks} bøger</strong>`;}

function printRecommendations(){
 const arr=booksInScope().filter(b=>b.status==='done'&&b.recommended);
 const map=new Map();
 for(const b of arr){const k=String(b.title||'').trim().toLocaleLowerCase('da');if(!k)continue;const x=map.get(k)||{title:b.title,author:b.author||'',names:[],lix:b.lix};x.names.push(nameOf(b.studentId));if(!x.author&&b.author)x.author=b.author;if(x.lix==null&&b.lix!=null)x.lix=b.lix;map.set(k,x);}
 const books=[...map.values()].sort((a,b)=>a.title.localeCompare(b.title,'da'));
 const title=cohort(selectedCohort)?selectedClassName(cohort(selectedCohort)):'Klassen';
 const html=`<!doctype html><html lang="da"><head><meta charset="utf-8"><title>Vores boganbefalinger</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:36px auto;color:#1c3028;padding:0 18px}h1{font-size:32px}article{border-bottom:1px solid #ccd5d0;padding:17px 0;break-inside:avoid}h2{margin:0 0 6px;font-size:21px}.meta{color:#596c62}.tag{color:#a56d18;font-weight:bold}button{padding:12px 18px;border-radius:8px;cursor:pointer}@media print{button{display:none}body{margin:0}}

</style></head><body><button onclick="window.print()">Udskriv / Gem som PDF</button><h1>⭐ ${esc(title)} anbefaler</h1><p>${books.length} ${books.length===1?'anbefalet titel':'anbefalede titler'} fra klassens læsning</p>${books.length?books.map(b=>`<article><h2>${esc(b.title)}</h2><div class="meta">${b.author?'Af '+esc(b.author)+' · ':''}${b.lix!=null?'LIX '+esc(b.lix)+' · ':''}<span class="tag">⭐ ${b.names.length} ${b.names.length===1?'anbefaling':'anbefalinger'}</span></div><p>Anbefalet af: ${esc([...new Set(b.names)].join(', '))}</p></article>`).join(''):'<p>Ingen anbefalinger registreret endnu.</p>'}</body></html>`;
 const w=window.open('','_blank');if(!w){alert('Tillad pop op-vinduer for at åbne anbefalingslisten.');return;}w.document.open();w.document.write(html);w.document.close();
}
function openClassDisplay(){
 const c=cohort(selectedCohort);if(!c)return;const done=displayBooks(),arr=booksInScope(),sum=summary(arr),tops=displayTopData(),title=selectedClassName(c),unique=new Set(done.map(b=>String(b.title||'').trim().toLocaleLowerCase('da')).filter(Boolean)).size;
 $('classdisplay').innerHTML=`<div class="cd-wrap"><div class="cd-top"><div><div class="cd-kicker">Vores læseår</div><div class="cd-title">${esc(title)}</div><div class="cd-sub">Det her har vi skabt sammen – én bog ad gangen.</div></div><button type="button" class="cd-close" id="closeclassdisplay">Luk ×</button></div><div class="cd-stats"><div class="cd-stat"><span>Afsluttede bøger</span><strong>${sum.count}</strong></div><div class="cd-stat"><span>Læste sider</span><strong>${fmt(sum.pages)}</strong></div><div class="cd-stat"><span>Forskellige titler</span><strong>${unique}</strong></div></div><div class="cd-sectiontitle"><h2>📚 Vores bogreol</h2><p>${done.length?'Alle klassens afsluttede bøger':'Her vokser reolen gennem året'}</p></div><div class="bookshelf">${shelfHtml(done)}</div><div id="bookdetail" class="book-detail hidden"></div><div class="cd-sectiontitle"><h2>✨ Top lige nu</h2><p>Forskellige måder at rykke sig på</p></div>${tops.length?`<div class="cd-topcards">${tops.map(x=>`<div class="cd-award"><small>${esc(x.label)}</small><strong>${esc(x.name)}</strong><span>${esc(x.value)}</span></div>`).join('')}</div>`:'<div class="cd-empty">Der kommer fremhævelser her, når der er lidt mere læsedata.</div>'}<div class="cd-milestone">${classMilestone(sum.count,sum.pages)}</div></div>`;
 $('classdisplay').classList.remove('hidden');document.body.style.overflow='hidden';
}
function closeClassDisplay(){$('classdisplay').classList.add('hidden');$('classdisplay').innerHTML='';document.body.style.overflow='';}

function renderOverview(){const arr=booksInScope(),ss=visibleStudents(),rows=ss.map(st=>{const b=booksOf(st.id),last=sortedBooks(b).at(-1),active=b.filter(x=>x.status==='reading');return `<tr><td><button data-student="${esc(st.id)}">${esc(st.name)}</button>${st.archived?' <span class="tag">Arkiveret</span>':''}</td><td>${summary(b).count}</td><td>${fmt(summary(b).pages)}</td><td>${active.map(x=>esc(x.title)).join(', ')||'—'}</td><td>${last?date(last.end||last.start):'—'}</td></tr>`;}).join('');$('overview').innerHTML=context()+`<div class="panel"><div class="section-heading"><h2>Klasseoverblik</h2><button type="button" id="openclassdisplay" class="primary">✨ Vis for klassen</button> <button type="button" id="printrecommendations">⭐ Bog-anbefalinger</button></div>${cards(summary(arr))}<p class="muted">Bøger tælles i det skoleår, hvor de blev afsluttet. Læsning og lytning holdes adskilt og beregnes ud fra bogens samlede kalenderdage, også ved fravær og skoleårsskifte.</p></div><div class="panel"><h2>Elevernes læsning</h2>${ss.length?`<div class="scroll"><table><thead><tr><th>Elev</th><th>Bøger</th><th>Sider</th><th>I gang med</th><th>Seneste bogdato</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Ingen elever i den valgte visning.</div>'}</div>`;}
function bookRows(arr,withStudent=false,latestFirst=false){return `<div class="scroll"><table><thead><tr>${withStudent?'<th>Elev</th>':''}<th>Titel</th><th>Læseform</th><th>Status</th><th>Start</th><th>Slut</th><th>Sider</th><th>Lyttet</th><th>LIX</th><th>Sider/dag</th><th>Min./dag</th><th>Handling</th></tr></thead><tbody>${(latestFirst?sortedBooks(arr).reverse():sortedBooks(arr)).map(b=>`<tr>${withStudent?`<td>${esc(nameOf(b.studentId))}</td>`:''}<td>${esc(b.title)}${b.recommended?' <span title="Eleven anbefaler bogen">⭐</span>':''}${b.author?`<br><small class="muted">${esc(b.author)}</small>`:''}</td><td><span class="tag">${modeLabel(b)}</span></td><td><span class="tag">${b.status==='done'?'Afsluttet':b.status==='abandoned'?'Opgivet':'I gang'}</span></td><td>${date(b.start)}</td><td>${date(b.end)}</td><td>${['done','abandoned'].includes(b.status)&&modeOf(b)!=='audio'&&pages(b)>0?fmt(pages(b)):'—'}</td><td>${['done','abandoned'].includes(b.status)&&modeOf(b)!=='read'&&listenedMinutes(b)>0?duration(listenedMinutes(b)):'—'}</td><td>${b.lix??'—'}</td><td>${pace(b)===null?'—':fmt(pace(b))}</td><td>${audioPace(b)===null?'—':fmt(audioPace(b))}</td><td class="row-actions"><button data-edit="${esc(b.id)}">Redigér</button> <button class="danger" data-delete-book="${esc(b.id)}">Slet</button></td></tr>`).join('')}</tbody></table></div>`;}
function periodRows(arr){return arr.length?`<div class="scroll"><table><thead><tr><th>Periode</th><th>Kategori</th><th>Bemærkning</th><th>Handling</th></tr></thead><tbody>${arr.sort((a,b)=>a.from.localeCompare(b.from)).map(p=>`<tr><td>${date(p.from)} – ${date(p.to)}</td><td>${esc(periodLabel(p.kind))}</td><td>${esc(p.note||'—')}</td><td class="row-actions"><button data-edit-period="${esc(p.id)}">Redigér</button> <button class="danger" data-delete-period="${esc(p.id)}">Slet</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ingen perioder registreret.</div>';}
const periodsOf=(id)=>state.periods.filter(p=>(p.studentId===id||(p.studentId===null&&p.cohortId===selectedCohort))&&(selectedYear==='all'||p.from<=yearRange().to&&p.to>=yearRange().from));

let selectedReadingPoint=0;
function readingProfile(st,arr){
 const sum=summary(arr),series=sortedBooks(arr.filter(b=>pace(b)!==null));
 const count=series.length,chosen=Math.max(0,Math.min(selectedReadingPoint,count-1));
 const max=Math.max(1,...series.map(b=>pace(b)||0)),top=Math.max(5,Math.ceil(max/5)*5);
 const left=76,right=740,topY=35,bottom=275,w=right-left,h=bottom-topY;
 const xy=series.map((b,i)=>({x:count===1?(left+right)/2:left+i*w/(count-1),y:bottom-(pace(b)/top)*h,b}));
 const line=xy.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
 const selected=series[chosen];
 const chart=series.length?`<svg class="rp-graph" viewBox="0 0 790 338" role="img" aria-label="Interaktiv graf over sider pr. kalenderdag for hver bog">
 ${[0,1,2,3,4].map(i=>{const y=bottom-i*h/4;return `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#e7ebee" stroke-dasharray="5 7"/><text x="${left-10}" y="${y+5}" text-anchor="end" font-size="15" fill="#78818b">${fmt(i*top/4)}</text>`;}).join('')}
 <text x="22" y="180" transform="rotate(-90 22 180)" text-anchor="middle" font-size="16" fill="#67727c">Sider pr. dag</text>
 <path d="${line}" fill="none" stroke="#3476dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 ${xy.map((p,i)=>`<circle class="rp-point" tabindex="0" role="button" data-rp-index="${i}" aria-label="${esc(p.b.title)}: ${fmt(pace(p.b))} sider pr. dag" cx="${p.x}" cy="${p.y}" r="${chosen===i?8:6}" fill="#3476dc" stroke="white" stroke-width="2"><title>${esc(p.b.title)} · ${fmt(pace(p.b))} sider/dag</title></circle>`).join('')}
 ${xy.filter((p,i)=>count<=9||i===0||i===count-1||i===chosen).map(p=>{const i=xy.indexOf(p);return `<text x="${p.x}" y="310" text-anchor="middle" font-size="14" fill="#65717a">Bog ${i+1}</text>`;}).join('')}
 </svg>`:'<div class="empty">Grafen vises, når eleven har afsluttet sin første bog med registreret sidetal og læseperiode.</div>';
 return `<div class="reading-profile"><div class="rp-kicker">Læseoversigt · ${esc(selectedClassName(cohort(selectedCohort)))}</div><h2 class="rp-title">${esc(st.name)}</h2>
 <div class="rp-stats"><div class="rp-stat"><strong>${sum.count}</strong><span>Bøger læst</span></div><div class="rp-stat"><strong>${fmt(sum.pages)}</strong><span>Sider læst</span></div><div class="rp-stat"><strong>${sum.pace===null?'—':fmt(sum.pace)}</strong><span>Sider pr. dag</span></div></div>
 <h3>Læsetempo pr. bog</h3><p class="muted">Klik på et punkt i grafen eller en række i tabellen for at undersøge en bog.</p>${chart}
 ${selected?`<div class="rp-detail" id="rp-detail"><strong>${esc(selected.title)}</strong> · ${fmt(pace(selected))} sider pr. kalenderdag<br><small>${fmt(pages(selected))} sider · ${date(selected.start)} – ${date(selected.end)} · ${selected.status==='abandoned'?'Opgivet':'Afsluttet'}</small></div>`:''}
 ${series.length?`<div class="scroll"><table class="rp-table"><thead><tr><th>Bog</th><th>Sider</th><th>Dage</th><th>Sider/dag</th></tr></thead><tbody>${series.map((b,i)=>`<tr data-rp-index="${i}" class="${i===chosen?'rp-selected':''}" tabindex="0"><td>${esc(b.title)}</td><td>${fmt(pages(b))}</td><td>${b.start&&b.end?day(b.start,b.end):'—'}</td><td>${fmt(pace(b))}</td></tr>`).join('')}</tbody></table></div>`:''}
 <p class="muted"><small>Sider pr. dag beregnes ud fra kalenderdage mellem bogens start- og slutdato – ikke faktisk læsehastighed.</small></p>
