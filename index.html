<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LæseTracker</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#21342b;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}header{background:#245a42;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:1.7rem}header p{margin:5px 0 0;color:#d8eadf}main{max-width:1050px;margin:auto;padding:22px 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,.btn{border:1px solid #b9d1c3;background:white;color:#245a42;padding:10px 13px;border-radius:9px;cursor:pointer;font:inherit}button:hover{background:#e5f2e9}button.primary,nav button.active{background:#245a42;color:white}button.danger{color:#9b2636;border-color:#e5b7bf}button:disabled{opacity:.5;cursor:not-allowed}.panel{background:white;border:1px solid #dce8df;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #17432a08}h2{margin:0 0 15px;font-size:1.3rem}h3{margin:12px 0}p{line-height:1.5}.muted,small{color:#60776a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#eaf4ed;border-radius:12px;padding:15px}.stat strong{display:block;font-size:1.8rem;margin-top:6px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-weight:600;font-size:.9rem}input,select{display:block;width:100%;border:1px solid #b9cbbf;border-radius:8px;padding:10px;margin-top:5px;font:inherit;background:white;color:#21342b}input[type=file]{max-width:360px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e5eee8;padding:10px 7px}th{font-size:.86rem;color:#516c5a}td:last-child{text-align:right}.scroll{overflow-x:auto}.empty{padding:18px;color:#60776a;background:#f5f8f5;border-radius:10px}.tag{display:inline-block;border-radius:20px;padding:3px 9px;background:#eaf4ed;color:#245a42;font-size:.8rem}.warning{background:#fff5df;padding:12px;border-radius:9px;color:#6b4b15}.bar{height:12px;background:#e5eee8;border-radius:12px;overflow:hidden}.bar span{display:block;height:100%;background:#398663}.barrow{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;margin:9px 0}.hidden{display:none!important}#printarea{display:none}@media(max-width:600px){.barrow{grid-template-columns:85px 1fr 50px;font-size:.8rem}}@media print{header,main,nav,.no-print{display:none!important}#printarea{display:block!important;color:#111;font:12pt Georgia,serif;padding:15mm}#printarea table{font:10pt Arial,sans-serif}#printarea h1{font-size:22pt}#printarea .stat{border:1px solid #aaa;background:white}#printarea .grid{grid-template-columns:repeat(3,1fr)}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<header><h1>📚 LæseTracker</h1><p>Overblik over klassens læseindsats</p></header>
<main>
<nav id="nav"><button data-tab="overview" class="active">Klasseoverblik</button><button data-tab="students">Elever</button><button data-tab="books">Bøger</button><button data-tab="backup">Sikkerhedskopi</button></nav>
<section id="overview" class="tab"></section>
<section id="students" class="tab hidden"></section>
<section id="books" class="tab hidden"></section>
<section id="backup" class="tab hidden"></section>
<p class="muted no-print"><small>Oplysningerne gemmes kun i denne browsers lokale lager. Brug fiktive data, indtil skolens regler for opbevaring af elevoplysninger er afklaret.</small></p>
</main><div id="printarea"></div>
<script>
'use strict';
const KEY='laesetracker_v1';
const $=id=>document.getElementById(id);
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?.()||String(Date.now())+'_'+Math.random().toString(36).slice(2);
let state=load(),tab='overview',selectedStudent='',editingBook='';
function load(){try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&Array.isArray(data.students)&&Array.isArray(data.books))return data;}catch(e){}return {students:[],books:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){alert('Data kunne ikke gemmes. Kontrollér browserens lagerplads, og eksportér en sikkerhedskopi.');return false;}}
const dateStr=s=>s?new Date(s+'T12:00:00').toLocaleDateString('da-DK'): '—';
const days=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/86400000)+1;
const num=n=>new Intl.NumberFormat('da-DK',{maximumFractionDigits:1}).format(n);
const readPages=b=>b.status==='done'?Math.max(0,b.pages-b.startPage+1):0;
const rate=b=>b.status==='done'?readPages(b)/days(b.start,b.end):null;
const student=id=>state.students.find(s=>s.id===id);
const booksOf=id=>state.books.filter(b=>b.studentId===id);
const nameOf=id=>student(id)?.name||'(slettet elev)';
const sortedBooks=arr=>[...arr].sort((a,b)=>(a.end||a.start).localeCompare(b.end||b.start));
function summary(arr){const done=arr.filter(b=>b.status==='done'),pages=done.reduce((n,b)=>n+readPages(b),0),time=done.reduce((n,b)=>n+days(b.start,b.end),0);return {count:done.length,pages,pace:time?pages/time:0};}
function cards(s){return `<div class="grid"><div class="stat">Afsluttede bøger<strong>${s.count}</strong></div><div class="stat">Registrerede sider<strong>${num(s.pages)}</strong></div><div class="stat">Sider pr. kalenderdag<strong>${s.count?num(s.pace):'—'}</strong></div></div>`;}
function renderOverview(){const s=summary(state.books);const rows=state.students.map(st=>{const bs=booksOf(st.id),last=sortedBooks(bs).at(-1),active=bs.filter(b=>b.status==='reading');return `<tr><td><button data-student="${st.id}">${escapeHtml(st.name)}</button></td><td>${summary(bs).count}</td><td>${num(summary(bs).pages)}</td><td>${active.map(b=>escapeHtml(b.title)).join(', ')||'—'}</td><td>${last?dateStr(last.end||last.start):'—'}</td></tr>`}).join('');$('overview').innerHTML=`<div class="panel"><h2>Klasseoverblik</h2>${cards(s)}<p class="muted">Gennemsnittet er beregnet ud fra de afsluttede bøgers kalenderdage, inklusive weekender og fridage. Det viser ikke, hvilke dage eleven faktisk læste.</p></div><div class="panel"><h2>Elevernes læsning</h2>${state.students.length?`<div class="scroll"><table><thead><tr><th>Elev</th><th>Bøger</th><th>Sider</th><th>I gang med</th><th>Seneste bogdato</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Ingen elever endnu. Gå til Elever for at oprette en elev.</div>'}</div>`;}
function bookRows(arr,withStudent=false){return `<div class="scroll"><table><thead><tr>${withStudent?'<th>Elev</th>':''}<th>Titel</th><th>Status</th><th>Start</th><th>Slut</th><th>Sider</th><th>LIX</th><th>Sider/dag</th><th>Handling</th></tr></thead><tbody>${sortedBooks(arr).map(b=>`<tr>${withStudent?`<td>${escapeHtml(nameOf(b.studentId))}</td>`:''}<td>${escapeHtml(b.title)}</td><td><span class="tag">${b.status==='done'?'Afsluttet':b.status==='abandoned'?'Opgivet':'I gang'}</span></td><td>${dateStr(b.start)}</td><td>${dateStr(b.end)}</td><td>${b.status==='done'?num(readPages(b)):'—'}</td><td>${b.lix??'—'}</td><td>${rate(b)===null?'—':num(rate(b))}</td><td><button data-edit="${b.id}">Redigér</button></td></tr>`).join('')}</tbody></table></div>`;}
function renderStudents(){const opts=state.students.map(s=>`<option value="${s.id}" ${selectedStudent===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');if(!student(selectedStudent))selectedStudent=state.students[0]?.id||'';const st=student(selectedStudent),arr=booksOf(selectedStudent),done=sortedBooks(arr.filter(b=>b.status==='done'));const max=Math.max(1,...done.map(b=>rate(b)));const bars=done.map((b,i)=>`<div class="barrow"><span title="${escapeHtml(b.title)}">Bog ${i+1}</span><div class="bar"><span style="width:${100*rate(b)/max}%"></span></div><span>${num(rate(b))}</span></div>`).join('');$('students').innerHTML=`<div class="panel"><h2>Opret elev</h2><form id="studentform"><div class="fields"><label>Elevnavn<input name="name" required maxlength="100" placeholder="Brug fiktivt navn under afprøvning"></label></div><div class="actions"><button class="primary" type="submit">Tilføj elev</button></div></form></div>${st?`<div class="panel"><h2>Elevprofil</h2><label>Vælg elev<select id="studentselect">${opts}</select></label><div style="height:14px"></div>${cards(summary(arr))}<p><strong>Aktuelle bøger:</strong> ${arr.filter(b=>b.status==='reading').map(b=>escapeHtml(b.title)).join(', ')||'Ingen registreret'}</p><h3>Læsetempo pr. afsluttet bog</h3>${done.length?bars:'<div class="empty">Ingen afsluttede bøger endnu.</div>'}<p class="muted">Hver søjle viser sider pr. kalenderdag for en afsluttet bog, ikke målt læsehastighed.</p><div class="actions"><button id="printstudent">Udskriv elevrapport</button><button id="deletestudent" class="danger">Slet elev og elevens bøger</button></div></div><div class="panel"><h2>Boghistorik</h2>${arr.length?bookRows(arr):'<div class="empty">Ingen bøger registreret endnu.</div>'}</div>`:''}`;}
function renderBooks(){const b=state.books.find(x=>x.id===editingBook),opts=state.students.map(s=>`<option value="${s.id}" ${b?.studentId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');$('books').innerHTML=`<div class="panel"><h2>${b?'Redigér bog':'Registrer bog'}</h2>${state.students.length?`<form id="bookform"><div class="fields"><label>Elev<select name="studentId" required>${opts}</select></label><label>Bogens titel<input name="title" required maxlength="250" value="${escapeHtml(b?.title||'')}"></label><label>Startdato<input type="date" name="start" required value="${b?.start||''}"></label><label>Status<select name="status" id="status"><option value="reading" ${b?.status==='reading'?'selected':''}>I gang</option><option value="done" ${b?.status==='done'?'selected':''}>Afsluttet</option><option value="abandoned" ${b?.status==='abandoned'?'selected':''}>Opgivet</option></select></label><label>Slutdato (ved afslutning/opgivelse)<input type="date" name="end" value="${b?.end||''}"></label><label>Bogens samlede sideantal<input type="number" name="pages" min="1" max="100000" required value="${b?.pages||''}"></label><label>Startside (normalt 1)<input type="number" name="startPage" min="1" max="100000" required value="${b?.startPage??1}"></label><label>LIX (valgfrit)<input type="number" name="lix" min="0" max="200" value="${b?.lix??''}"></label></div><div class="actions"><button class="primary" type="submit">${b?'Gem ændringer':'Gem bog'}</button>${b?'<button type="button" id="cancelEdit">Annullér</button><button type="button" class="danger" id="deleteBook">Slet bog</button>':''}</div></form>`:'<div class="empty">Opret først en elev under Elever.</div>'}</div><div class="panel"><h2>Alle bøger</h2>${state.books.length?bookRows(state.books,true):'<div class="empty">Ingen bøger registreret endnu.</div>'}</div>`;}
function renderBackup(){$('backup').innerHTML=`<div class="panel"><h2>Sikkerhedskopi</h2><p>Eksportér alle registreringer til en JSON-fil. Opbevar filen efter skolens regler for elevoplysninger. En sikkerhedskopi bør tages jævnligt og inden browserdata slettes eller computeren udskiftes.</p><button id="export" class="primary">Hent sikkerhedskopi</button></div><div class="panel"><h2>Gendan sikkerhedskopi</h2><p class="warning">Indlæsning erstatter samtlige nuværende registreringer i denne browser. Hent først en sikkerhedskopi af de eksisterende data.</p><label>Vælg tidligere eksporteret JSON-fil<input id="importfile" type="file" accept=".json,application/json"></label><div class="actions"><button id="import">Indlæs sikkerhedskopi</button></div></div>`;}
function render(){renderOverview();renderStudents();renderBooks();renderBackup();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==tab));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));}
function switchTab(t){tab=t;render();}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab);});
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.student){selectedStudent=target.dataset.student;switchTab('students');}if(target.dataset.edit){editingBook=target.dataset.edit;switchTab('books');window.scrollTo(0,0);}if(target.id==='cancelEdit'){editingBook='';render();}if(target.id==='deleteBook'){if(confirm('Vil du slette denne bog?')){state.books=state.books.filter(b=>b.id!==editingBook);editingBook='';save();render();}}if(target.id==='deletestudent'&&student(selectedStudent)){if(confirm('Slet eleven og ALLE elevens bogregistreringer? Dette kan ikke fortrydes uden en sikkerhedskopi.')){state.students=state.students.filter(s=>s.id!==selectedStudent);state.books=state.books.filter(b=>b.studentId!==selectedStudent);selectedStudent='';save();render();}}if(target.id==='printstudent')printStudent();if(target.id==='export')exportData();if(target.id==='import')importData();});
document.addEventListener('change',e=>{if(e.target.id==='studentselect'){selectedStudent=e.target.value;render();}});
document.addEventListener('submit',e=>{if(e.target.id==='studentform'){e.preventDefault();const name=new FormData(e.target).get('name').trim();if(!name)return;if(state.students.some(s=>s.name.toLocaleLowerCase('da')===name.toLocaleLowerCase('da')))return alert('En elev med det navn findes allerede.');const s={id:uuid(),name};state.students.push(s);selectedStudent=s.id;save();render();}if(e.target.id==='bookform'){e.preventDefault();const f=new FormData(e.target),start=f.get('start'),end=f.get('end'),status=f.get('status'),pages=Number(f.get('pages')),startPage=Number(f.get('startPage')),lix=f.get('lix')===''?null:Number(f.get('lix'));if(!student(f.get('studentId')))return alert('Vælg en gyldig elev.');if(!Number.isInteger(pages)||pages<1||!Number.isInteger(startPage)||startPage<1||startPage>pages)return alert('Kontrollér sideantal og startside.');if((status!=='reading'&&!end)||(end&&days(start,end)<1))return alert('Kontrollér startdato og slutdato. Afsluttede/opgivne bøger skal have en slutdato.');if(lix!==null&&(!Number.isFinite(lix)||lix<0||lix>200))return alert('Kontrollér LIX.');const b={id:editingBook||uuid(),studentId:f.get('studentId'),title:String(f.get('title')).trim(),start,end:status==='reading'?'':end,status,pages,startPage,lix};if(!b.title)return alert('Indtast titel.');if(editingBook){state.books=state.books.map(x=>x.id===editingBook?b:x);}else state.books.push(b);editingBook='';save();render();}});
function exportData(){const blob=new Blob([JSON.stringify({format:'laesetracker',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LaeseTracker-sikkerhedskopi-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importData(){const file=$('importfile')?.files[0];if(!file)return alert('Vælg en sikkerhedskopi først.');let data;try{data=JSON.parse(await file.text());}catch(e){return alert('Filen kunne ikke læses som JSON.');}if(data?.format!=='laesetracker'||data.version!==1||!Array.isArray(data.students)||!Array.isArray(data.books)||data.students.some(s=>typeof s.id!=='string'||typeof s.name!=='string')||data.books.some(b=>typeof b.id!=='string'||typeof b.studentId!=='string'||typeof b.title!=='string'||!['reading','done','abandoned'].includes(b.status)||!/^\d{4}-\d{2}-\d{2}$/.test(b.start)||!Number.isInteger(b.pages)||!Number.isInteger(b.startPage)||b.pages<1||b.startPage<1||b.startPage>b.pages||((b.status==='done'||b.status==='abandoned')&&!/^\d{4}-\d{2}-\d{2}$/.test(b.end))||b.end&&days(b.start,b.end)<1))return alert('Filen har ikke det forventede format.');if(!confirm('Erstat ALLE nuværende registreringer med filens indhold?'))return;state={students:data.students,books:data.books};selectedStudent='';editingBook='';save();render();alert('Sikkerhedskopien er indlæst.');}
function printStudent(){const st=student(selectedStudent);if(!st)return;const arr=booksOf(st.id),s=summary(arr);$('printarea').innerHTML=`<h1>Læserapport: ${escapeHtml(st.name)}</h1><p>Udskrevet ${dateStr(new Date().toISOString().slice(0,10))}</p>${cards(s)}<h2>Boghistorik</h2><table><thead><tr><th>Titel</th><th>Start</th><th>Slut</th><th>Status</th><th>Læs­te sider</th><th>LIX</th><th>Sider/dag</th></tr></thead><tbody>${sortedBooks(arr).map(b=>`<tr><td>${escapeHtml(b.title)}</td><td>${dateStr(b.start)}</td><td>${dateStr(b.end)}</td><td>${b.status==='done'?'Afsluttet':b.status==='reading'?'I gang':'Opgivet'}</td><td>${b.status==='done'?readPages(b):'—'}</td><td>${b.lix??'—'}</td><td>${rate(b)===null?'—':num(rate(b))}</td></tr>`).join('')}</tbody></table><p><small>Gennemsnit: registrerede læste sider divideret med kalenderdage for afsluttede bøger. Dette er ikke et mål for faktisk læsehastighed eller daglig læsning.</small></p>`;window.print();}
render();
</script>
</body>
</html>
