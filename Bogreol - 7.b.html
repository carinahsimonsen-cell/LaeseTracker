const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('da-DK');const colors=['#a94f52','#3f7180','#8a633e','#62649a','#47745d','#9a6a76','#6f7d42','#49627f','#8a5541','#5d6e72'];
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const books=DATA.books;const total=books.reduce((n,b)=>n+b.count,0);const pages=DATA.pages;
$('stats').innerHTML='<div class="stat"><small>Afsluttede bøger</small><strong>'+fmt(total)+'</strong></div><div class="stat"><small>Læste sider</small><strong>'+fmt(pages)+'</strong></div><div class="stat"><small>Forskellige titler</small><strong>'+fmt(books.length)+'</strong></div><div class="stat"><small>Samlet læsetid</small><strong>'+ (DATA.readingProgress?.actualMinutes===null||DATA.readingProgress?.actualMinutes===undefined?'—':fmt(Math.round(DATA.readingProgress.actualMinutes/60))+' timer')+'</strong><div class="reading-target">'+(DATA.readingProgress?.targetMinutes==null?'Mål ikke fastsat':'af ca. '+fmt(Math.round(DATA.readingProgress.targetMinutes/60))+' timer')+'</div><div class="target-track"><div class="target-fill" style="width:'+(DATA.readingProgress?.targetMinutes>0?Math.min(100,Math.round(DATA.readingProgress.actualMinutes/DATA.readingProgress.targetMinutes*100)):0)+'%"></div></div><div class="target-note">Fælles mål: 100 min. pr. elev om ugen</div></div>';
function ratingLabel(avg){return avg===null||avg===undefined?'':'⭐ '+Number(avg).toLocaleString('da-DK',{minimumFractionDigits:1,maximumFractionDigits:1});}function starHtml(avg){return avg===null||avg===undefined?'':'<div class="stars" style="font-size:14px;white-space:nowrap">'+ratingLabel(avg)+'</div>';}
const shelfBooks=books.map((b,n)=>{const h=145+(n*23%45),w=Math.min(96,Math.max(54,52+(n*17%23)+0)),r=[-1.2,.4,0,1,-.5][n%5];return '<button class="spine" data-index="'+n+'" style="--h:'+h+'px;--w:'+w+'px;--r:'+r+'deg;--c:'+colors[n%colors.length]+'" title="'+escapeHtml(b.title)+'"><span class="spine-title">'+escapeHtml(b.title)+'</span>'+(b.count>1?'<span class="count">×'+b.count+'</span>':'')+starHtml(b.average)+'</button>'}).join('');
$('shelves').innerHTML=books.length?'<div class="shelf">'+shelfBooks+'</div>':'<p>Her vokser bogreolen, når vi afslutter bøger.</p>';
function arrangeShelves(){
 const root=$('shelves');if(!root || root.getBoundingClientRect().width<240)return;
 const all=[...root.querySelectorAll('.spine')];if(!all.length)return;
 const sample=root.querySelector('.shelf');if(!sample)return;
 const rs=getComputedStyle(root),ss=getComputedStyle(sample),gap=parseFloat(ss.columnGap)||5;
 const available=root.clientWidth-(parseFloat(rs.paddingLeft)||0)-(parseFloat(rs.paddingRight)||0)-(parseFloat(ss.paddingLeft)||0)-(parseFloat(ss.paddingRight)||0)-8;
 const rows=[];let row=[],used=0;
 for(const book of all){const w=parseFloat(book.style.getPropertyValue('--w'))||60;
  if(row.length&&used+gap+w>available){rows.push(row);row=[];used=0;}
  used+=(row.length?gap:0)+w;row.push(book);
 }
 if(row.length)rows.push(row);
 const fragment=document.createDocumentFragment();for(const group of rows){const r=document.createElement('div');r.className='shelf';group.forEach(b=>r.appendChild(b));fragment.appendChild(r);}root.replaceChildren(fragment);
}
let shelfWidth=0;
new ResizeObserver(entries=>{for(const e of entries){const w=e.target.getBoundingClientRect().width;if(w>=240&&Math.abs(w-shelfWidth)>1){shelfWidth=w;arrangeShelves();}}}).observe($('shelves'));
arrangeShelves();
const distribution=Array.isArray(DATA.distribution)?DATA.distribution:[];
const maxStudents=Math.max(1,...distribution.map(x=>x.students));
$('reading-distribution').innerHTML=distribution.length?distribution.map(x=>'<div class="reading-row"><span>'+x.books+' '+(x.books===1?'bog':'bøger')+'</span><div class="reading-bar"><div class="reading-fill" style="width:'+Math.round(100*x.students/maxStudents)+'%"></div></div><span class="reading-number">'+x.students+' '+(x.students===1?'elev':'elever')+'</span></div>').join(''):'<p>Ingen elever registreret endnu.</p>';

function showBook(i){const b=books[i];if(!b)return;const d=$('detail');const cover=typeof b.cover==='string'&&(/^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/i).test(b.cover)?b.cover:'';d.innerHTML='<div class="detail"><div>'+(cover?'<img alt="Forside" src="'+escapeHtml(cover)+'" onerror="this.hidden=true;this.nextElementSibling.hidden=false">':'')+'<div class="placeholder" '+(cover?'hidden':'')+'>📖 '+escapeHtml(b.title)+'</div></div><div><h2>'+escapeHtml(b.title)+'</h2>'+(b.author?'<p>Af '+escapeHtml(b.author)+'</p>':'')+'<p>'+b.count+' '+(b.count===1?'elev har':'elever har')+' afsluttet bogen</p>'+(b.isSeries?'<p>📚 Del af en bogserie</p>':'')+(b.descriptionUrl?'<p><a class="book-description-link" href="'+escapeHtml(b.descriptionUrl)+'" target="_blank" rel="noopener noreferrer">Læs om bogen ↗</a></p>':'')+'<p>'+starHtml(b.average)+'</p>'+'<h3>Elevernes vurderinger</h3><p>'+(b.ratingsCount?b.ratingsCount+' vurderinger':'Ingen vurderinger endnu')+'</p>'+(b.pupils||[]).map(p=>'<p style="margin:5px 0">'+escapeHtml(p.name)+' — '+(p.rating===null?'Ikke vurderet':'⭐ '+p.rating)+'</p>').join('')+'<button id="close">Luk</button></div></div>';d.hidden=false;d.scrollIntoView({behavior:'smooth',block:'nearest'});}
document.addEventListener('click',e=>{const link=e.target.closest('a.book-description-link');if(link){e.stopPropagation();if(window.parent!==window){e.preventDefault();const opened=window.open(link.href,'_blank');if(!opened)window.parent.postMessage({type:'laesetracker-open-book-link',url:link.href},'*');}return;}const b=e.target.closest('[data-index]');if(b)showBook(Number(b.dataset.index));if(e.target.closest('#close'))$('detail').hidden=true;});
</script></body></html>
