<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vores bogreol</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(circle at 15% 10%,#33465d 0,transparent 28%),radial-gradient(circle at 90% 18%,#543d62 0,transparent 30%),linear-gradient(145deg,#101722,#171c2b 55%,#10151e);color:#f8f2e8;font:16px system-ui,Arial,sans-serif;min-height:100vh}.wrap{max-width:1450px;margin:auto;padding:clamp(18px,3vw,44px)}h1{font-size:clamp(2.5rem,6vw,5rem);margin:0;font-weight:900}p{color:#cbd0d8}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:28px 0}.stat{background:#ffffff0b;border:1px solid #ffffff25;border-radius:16px;padding:18px}.stat small{display:block;text-transform:uppercase;letter-spacing:.07em;color:#d3d9e2}.stat strong{display:block;font-size:clamp(2rem,4vw,3rem)}h2{font-size:1.7rem}.shelves{background:#080d14aa;border-radius:16px;padding:18px 12px 24px}.shelf{display:flex;align-items:end;gap:5px;overflow-x:auto;min-height:220px;padding:16px 10px 10px;border-bottom:12px solid #9c6845;box-shadow:0 7px 0 #5a3625;margin-bottom:28px}.spine{flex:0 0 var(--w);height:var(--h);border:2px solid #e7ddc6;border-radius:5px 7px 2px 2px;background:var(--c);color:white;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:10px 3px 5px;cursor:pointer;transform:rotate(var(--r));box-shadow:3px 2px 7px #0008}.spine:hover,.spine:focus-visible{transform:translateY(-8px);outline:3px solid #f4d77b}.spine-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;min-height:0;max-height:100%;flex:1}.stars{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:var(--star);line-height:1.05;max-width:100%}.count{font-size:10px;background:#0005;border-radius:6px;padding:2px}.detail{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:26px;background:#f6f2df;color:#24362f;border-radius:18px;padding:24px;margin:22px 0}.detail h2{margin-top:0;overflow-wrap:anywhere}.detail p{color:#46574f}.detail img{width:100%;max-height:320px;object-fit:contain}.placeholder{min-height:250px;background:linear-gradient(140deg,#3b6471,#26413d);color:white;padding:20px;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere;border-radius:8px}.detail button{border:0;border-radius:8px;padding:10px 18px;background:#245949;color:white;cursor:pointer}.reading-overview{margin-top:28px;padding:20px;border:1px solid #ffffff30;border-radius:16px;background:#ffffff08}.reading-overview h2{font-size:1.25rem;margin:0 0 14px}.reading-row{display:grid;grid-template-columns:minmax(85px,125px) 1fr auto;gap:12px;align-items:center;margin:12px 0}.reading-bar{height:15px;border-radius:20px;background:#ffffff16;overflow:hidden}.reading-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#6cb9ae,#e8c17e)}.reading-number{font-weight:750;white-space:nowrap}@media(max-width:500px){.reading-row{grid-template-columns:82px 1fr auto;gap:8px;font-size:14px}}.milestone{border:1px solid #ffffff3d;border-radius:12px;padding:16px;margin-top:25px;text-align:center;font-size:1.1rem}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.detail{grid-template-columns:1fr}.detail img,.placeholder{max-width:220px}}
</style></head><body><main class="wrap"><h1>Vores bogreol</h1><p>Det her har vi skabt sammen – én bog ad gangen.</p><section id="stats" class="stats"></section><h2>📚 Vores bogreol</h2><div id="shelves" class="shelves"></div><section id="detail" hidden></section><section class="reading-overview"><h2>Så mange bøger har vi læst</h2><div id="reading-distribution"></div></section></main><script>
'use strict';const DATA={"pages":2068,"distribution":[{"books":2,"students":2},{"books":1,"students":9},{"books":0,"students":16}],"books":[{"title":"Bertie and the Alien Chicken","author":"Jenny Pearson","count":1,"stars":0,"names":[],"cover":"https://cdn.alinea.dk/2026-02/V6IPbvc12FLa/Bertie-and-the-Alien-Chicken-COVER/max/480x720.jpg","descriptionUrl":"https://superreaders.alinea.dk/book-info/BnYG-bertie-and-the-alien-chicken","isSeries":false},{"title":"Brødre","author":"Line Leonhardt \u0026 Palle Schmidt","count":1,"stars":1,"names":["Sofus"],"cover":"https://imgcdn.saxo.com/_9788772114828","descriptionUrl":"https://bibliotek.dk/materiale/broedre_line-leonhardt/work-of%3A870970-basis%3A139789024?tid=oy3bx17924957390991124279286","isSeries":false},{"title":"Den, der altid får skylden","author":"Trine Juul Hansen","count":1,"stars":1,"names":["Mathilde"],"cover":"https://imgcdn.saxo.com/_9788773698211","descriptionUrl":"https://bibliotek.dk/materiale/den-der-altid-faar-skylden_trine-juul-hansen/work-of%3A870970-basis%3A27300677?tid=Llny317924955051871248704939","isSeries":false},{"title":"Frederik fra forstaden","author":"Morten Dürr","count":1,"stars":1,"names":["Mohammed"],"cover":"https://imgcdn.saxo.com/_9788792789327","descriptionUrl":"https://bibliotek.dk/materiale/frederik-fra-forstaden_morten-durr/work-of%3A870970-basis%3A28638876?tid=WI9E017924956335841071522528","isSeries":false},{"title":"Hvis bare du var min","author":"Jenny Han","count":1,"stars":1,"names":["Linea"],"cover":"https://www.carlsen.dk/sites/carlsen.dk/public/styles/max_650x650/public/product/Hvis%20bare%20du%20var-3504429.jpg","descriptionUrl":"https://bibliotek.dk/materiale/hvis-bare-du-var-min_jenny-han/work-of%3A870970-basis%3A52091209?tid=ZS3Zm17924959229011216667588","isSeries":true},{"title":"Kloden under vand","author":"Ida-Marie Redtorff","count":1,"stars":0,"names":[],"cover":"https://imgcdn.saxo.com/_9788702129694","descriptionUrl":"https://bibliotek.dk/materiale/den-druknede-soldat_ida-marie-rendtorff/work-of%3A870970-basis%3A29278768?tid=j2imE17924959442231266912528","isSeries":true},{"title":"Mere end ord","author":"Eva Munk","count":1,"stars":1,"names":["Gustav"],"cover":"https://straarupogco.dk/wp-content/uploads/2022/05/Mere-end-ord-FORISDE-WEB.jpg","descriptionUrl":"https://bibliotek.dk/materiale/mere-end-ord_eva-munk/work-of%3A870970-basis%3A62754214?tid=Ecy_i17924954842331230285300","isSeries":false},{"title":"Oxy","author":"Peter Krogholm","count":1,"stars":1,"names":["Gustav"],"cover":"https://imgcdn.saxo.com/_9788772114422","descriptionUrl":"https://bibliotek.dk/materiale/oxy_peter-krogholm/work-of%3A870970-basis%3A138431568?tid=jJDAZ17924958992241284140786","isSeries":false},{"title":"Portalen","author":"Torsten Bengsson","count":1,"stars":1,"names":["Aske"],"cover":"https://cdn.shopify.com/s/files/1/0701/0782/4381/files/3311721_COVER_fe12fa3e-1260-4305-8d9b-918a32b1f338.jpg?v=1790663480","descriptionUrl":"https://bibliotek.dk/materiale/portalen_torsten-bengtsson/work-of%3A870970-basis%3A140600091?tid=jJDAZ17924956686211283283379","isSeries":true},{"title":"Sort Kanin","author":"Inge Duelund","count":2,"stars":0,"names":[],"cover":"https://dansklf.dk/img/500/700/resize/s/o/sort-kanin_forside-web.jpg","descriptionUrl":"https://bibliotek.dk/materiale/sort-kanin_inge-duelund-nielsen/work-of%3A870970-basis%3A143226085?tid=jJDAZ17924947588891279636891","isSeries":false},{"title":"Sådan har jeg det","author":"Natasha Høyer, Sonja Lovdal, Malene Severinsen, m.fl.","count":1,"stars":1,"names":["Lisa"],"cover":"https://www.williamdam.dk/products/3991945-large_default/saadan-har-jeg-det.jpg","descriptionUrl":"https://bibliotek.dk/materiale/saadan-har-jeg-det/work-of%3A870970-basis%3A139660552?tid=j2imE17924957891111266136817","isSeries":false},{"title":"Tusmørke","author":"Stephenie Meyer","count":1,"stars":0,"names":[],"cover":"https://fbiinfo-present.dbc.dk/images/4FeRHTmZT8ST6nBQ9b1O-g/240px!ASW2pAlU4h5II5iz6Q0aOFBc2oam3yOWPKn7pHkzBiINuQ","descriptionUrl":"https://bibliotek.dk/materiale/twilight-tusmoerke_stephenie-meyer/work-of%3A870970-basis%3A27589375?tid=j2imE17924955988651265092612","isSeries":true}]};
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('da-DK');const colors=['#a94f52','#3f7180','#8a633e','#62649a','#47745d','#9a6a76','#6f7d42','#49627f','#8a5541','#5d6e72'];
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const books=DATA.books;const total=books.reduce((n,b)=>n+b.count,0);const pages=DATA.pages;
$('stats').innerHTML='<div class="stat"><small>Afsluttede bøger</small><strong>'+fmt(total)+'</strong></div><div class="stat"><small>Læste sider</small><strong>'+fmt(pages)+'</strong></div><div class="stat"><small>Forskellige titler</small><strong>'+fmt(books.length)+'</strong></div>';
function starHtml(n){return n?'<div class="stars" style="--star:'+(n>30?7:n>16?8:n>8?9:11)+'px">'+Array(n).fill('⭐').join('')+'</div>':'';}
const rows=[];for(let i=0;i<books.length;i+=14){const row=books.slice(i,i+14);rows.push('<div class="shelf">'+row.map((b,j)=>{const n=i+j,h=145+(n*23%45),w=Math.min(96,Math.max(54,52+(n*17%23)+Math.floor(b.stars/6)*5)),r=[-1.2,.4,0,1,-.5][n%5];return '<button class="spine" data-index="'+n+'" style="--h:'+h+'px;--w:'+w+'px;--r:'+r+'deg;--c:'+colors[n%colors.length]+'" title="'+escapeHtml(b.title)+'"><span class="spine-title">'+escapeHtml(b.title)+'</span>'+(b.count>1?'<span class="count">×'+b.count+'</span>':'')+starHtml(b.stars)+'</button>'}).join('')+'</div>');}
$('shelves').innerHTML=rows.join('')||'<p>Her vokser bogreolen, når vi afslutter bøger.</p>';
const distribution=Array.isArray(DATA.distribution)?DATA.distribution:[];
const maxStudents=Math.max(1,...distribution.map(x=>x.students));
$('reading-distribution').innerHTML=distribution.length?distribution.map(x=>'<div class="reading-row"><span>'+x.books+' '+(x.books===1?'bog':'bøger')+'</span><div class="reading-bar"><div class="reading-fill" style="width:'+Math.round(100*x.students/maxStudents)+'%"></div></div><span class="reading-number">'+x.students+' '+(x.students===1?'elev':'elever')+'</span></div>').join(''):'<p>Ingen elever registreret endnu.</p>';

function showBook(i){const b=books[i];if(!b)return;const d=$('detail');const cover=typeof b.cover==='string'&&(/^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/i).test(b.cover)?b.cover:'';d.innerHTML='<div class="detail"><div>'+(cover?'<img alt="Forside" src="'+escapeHtml(cover)+'" onerror="this.hidden=true;this.nextElementSibling.hidden=false">':'')+'<div class="placeholder" '+(cover?'hidden':'')+'>📖 '+escapeHtml(b.title)+'</div></div><div><h2>'+escapeHtml(b.title)+'</h2>'+(b.author?'<p>Af '+escapeHtml(b.author)+'</p>':'')+'<p>'+b.count+' '+(b.count===1?'elev har':'elever har')+' afsluttet bogen</p>'+(b.isSeries?'<p>📚 Del af en bogserie</p>':'')+(b.descriptionUrl?'<p><a class="book-description-link" href="'+escapeHtml(b.descriptionUrl)+'" target="_blank" rel="noopener noreferrer">Læs om bogen ↗</a></p>':'')+'<p>'+starHtml(b.stars)+'</p><h3>Anbefalet af</h3><p>'+(b.names.length?escapeHtml(b.names.join(', ')):'Ingen anbefalinger endnu')+'</p><button id="close">Luk</button></div></div>';d.hidden=false;d.scrollIntoView({behavior:'smooth',block:'nearest'});}
document.addEventListener('click',e=>{const link=e.target.closest('a.book-description-link');if(link){e.stopPropagation();if(window.parent!==window){e.preventDefault();const opened=window.open(link.href,'_blank');if(!opened)window.parent.postMessage({type:'laesetracker-open-book-link',url:link.href},'*');}return;}const b=e.target.closest('[data-index]');if(b)showBook(Number(b.dataset.index));if(e.target.closest('#close'))$('detail').hidden=true;});
</script></body></html>
